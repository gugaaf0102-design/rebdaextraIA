<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Membros - IA na Prática</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; line-height: 1.6; }
        header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 30px 20px; text-align: center; border-bottom: 2px solid #334155; }
        h1 { font-size: 2rem; color: #38bdf8; }
        .container { max-width: 950px; margin: 0 auto; padding: 40px 20px; }
        
        / Caixa principal do Slide (Palco de cima) /
        .slide-box { background-color: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .slide-screen { min-height: 380px; padding: 30px; background-color: #0f172a; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; justify-content: center; }
        
        / Área de Descrição e Botões embaixo /
        .slide-footer { background-color: #1e293b; padding: 25px; border-radius: 16px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 15px; }
        .slide-description h2 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 8px; }
        .slide-description p { color: #94a3b8; font-size: 1.1rem; }
        
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 10px; }
        .btn { background-color: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background-color: #0ea5e9; }
    </style>
</head>
<body>
    <header>
        <h1>Área de Membros - IA na Prática</h1>
        <p style="color: #94a3b8; font-size: 1.1rem; margin-top: 5px;">Aulas em formato de slides.</p>
    </header>
