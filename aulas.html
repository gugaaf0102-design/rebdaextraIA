<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Membros - IA na Prática</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; line-height: 1.6; }
        header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 30px 20px; text-align: center; border-bottom: 2px solid #334155; }
        h1 { font-size: 2rem; color: #38bdf8; }
        .container { max-width: 950px; margin: 0 auto; padding: 40px 20px; }
        
        .slide-box { background-color: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 40px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .slide-content { min-height: 380px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; background-color: #0f172a; border-radius: 12px; border: 1px solid #334155; margin-bottom: 25px; }
        .slide-img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 20px; border-radius: 12px; background: #1e293b; padding: 10px; border: 1px solid #334155; }
        .slide-content h2 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 15px; }
        .slide-content p { color: #94a3b8; font-size: 1.2rem; max-width: 800px; }
    </style>
</head>
<body>
    <header>
        <h1>Área de Membros - IA na Prática</h1>
        <p style="color: #94a3b8; font-size: 1.1rem; margin-top: 5px;">Aulas em formato de slides ampliados.</p>
    </header>
    <div class="container">
        <div class="slide-box">
            <h2 style="color: #f8fafc; font-size: 1.4rem; margin-bottom: 20px;">📊 Apresentação das Aulas</h2>
            
            <div class="slide-content" id="slide-display">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo_2023.svg" alt="ChatGPT" class="slide-img">
                <h2>Slide 1: O Poder do ChatGPT</h2>
                <p>Domine os prompts secretos para criar textos de vendas e estruturas magnéticas em segundos para faturar com renda extra.</p>
            </div>
        </div>
    </div>
</body>
</html>
