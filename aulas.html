<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Membros - IA na Prática</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; line-height: 1.6; }
        header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 30px 20px; text-align: center; border-bottom: 2px solid #334155; }
        h1 { font-size: 2rem; color: #38bdf8; }
        .container { max-width: 950px; margin: 0 auto; padding: 40px 20px; }
    </style>
</head>
<body>
    <header>
        <h1>Área de Membros - IA na Prática</h1>
        <p style="color: #94a3b8; font-size: 1.1rem; margin-top: 5px;">Aulas em formato de slides.</p>
    </header>
    <div class="container">
        <!-- MOLDURA PROFISSIONAL DO SLIDE -->
        <div style="background: linear-gradient(145deg, #1e293b, #0f172a); padding: 8px; border-radius: 20px; border: 3px solid #38bdf8; margin-bottom: 25px; box-shadow: 0 0 30px rgba(56, 189, 248, 0.15), inset 0 0 15px rgba(56, 189, 248, 0.05);">
            <div style="background-color: #1e293b; padding: 20px; border-radius: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #334155;">
                    <h2 style="color: #f8fafc; font-size: 1.2rem;">📊 Apresentação da Aula</h2>
                    <span class="slide-badge" style="background: linear-gradient(90deg, #10a37f, #0d8065); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; box-shadow: 0 2px 8px rgba(16, 163, 127, 0.3);">Slide 01</span>
                </div>

                <!-- Tela Interna do Slide -->
                <div class="slide-screen" style="min-height: 380px; padding: 30px; background: linear-gradient(180deg, #0f172a, #1e293b); border-radius: 14px; border: 2px solid #38bdf8; display: flex; flex-direction: column; justify-content: center; box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.08);">
                    
                    <!-- Cabeçalho com IMAGEM PROFISSIONAL (aparece nos 2 slides) -->
                    <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; width: 100%;">
                        <div style="background: linear-gradient(145deg, #10a37f, #0d8065); padding: 14px; border-radius: 14px; display: flex; align-items: center; justify-content: center; width: 75px; height: 75px; flex-shrink: 0; box-shadow: 0 4px 12px rgba(16, 163, 127, 0.35);">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .5154 4.9107 6.051 6.051 0 0 0 6.51 2.9A6.0651 6.0651 0 0 0 19.0193 19.818a5.9847 5.9847 0 0 0 3.9977-2.9 6.0462 6.0462 0 0 0-.7351-7.0969z" fill="white"/><path d="M15.5 13.25L12 11.25L8.5 13.25V9.25L12 7.25L15.5 9.25V13.25Z" fill="#10a37f"/></svg>
                        </div>
                        <div>
                            <h3 style="color: #38bdf8; font-size: 1.4rem;"></h3>
                            <p style="color: #94a3b8; font-size: 0.95rem; margin-top: 4px;"></p>
                        </div>
                    </div>

                    <!-- Conteúdo do Slide -->
                    <div class="slide-content" style="color: #f8fafc; font-size: 1.05rem; display: flex; flex-direction: column; gap: 12px; width: 100%; text-align: left;"></div>
                </div>
            </div>
        </div>
        <!-- CAIXA DE DESCRIÇÃO E BOTÕES -->
        <div style="background: linear-gradient(145deg, #1e293b, #0f172a); padding: 25px; border-radius: 16px; border: 2px solid #38bdf8; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);">
            <div>
                <h2 style="color: #38bdf8; font-size: 1.5rem; margin-bottom: 8px;"></h2>
                <p style="color: #94a3b8; font-size: 1.1rem;"></p>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                <button class="btn-nav" style="background: linear-gradient(90deg, #334155, #475569); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">◀ Anterior</button>
                <button class="btn-nav" style="background: linear-gradient(90deg, #10a37f, #0d8065); color: white; border: none; padding: 12px 28px; font-size: 1.05rem; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 163, 127, 0.3);">Próximo ▶</button>
            </div>
        </div>
    </div>
    <script>
        const slides = [
            {
                badge: "Slide 01",
                titleHeader: "Como Fazer Dinheiro com o ChatGPT",
                descHeader: "Guia prático para faturar com inteligência artificial.",
                content: '<p><strong>1. Copywriting para Vendas:</strong> Use prompts para criar cartas de vendas, e-mails e anúncios que prendem a atenção e convertem clientes.</p><p><strong>2. Serviços de Freelancer:</strong> Ofereça tradução, artigos otimizados para Google e roteiros prontos para vídeos, entregando em minutos.</p><p><strong>3. Criação de Infoprodutos:</strong> Monte e-books, apostilas e cursos completos com a ajuda da IA, reduzindo o trabalho de meses para dias.</p>',
                titleFooter: "Slide 1: O Poder do ChatGPT",
                descFooter: "Descubra as 3 formas mais rápidas de começar a ganhar dinheiro usando inteligência artificial hoje mesmo."
            },
            {
                badge: "Slide 02",
                titleHeader: "Estratégias Avançadas — Passo a Passo Completo",
                descHeader: "Saiba EXATAMENTE como aplicar e cobrar por seus serviços.",
                content: '<p><strong>1. AGÊNCIA DE CONTEÚDO — Como funciona:</strong> Você cria UM prompt modelo pedindo: "Escreva 5 posts sobre [tema], com tom amigável, chamada para ação e hashtags". Depois manda: "Agora reescreva cada um de 3 formas diferentes". Com UMA mensagem, gera 15 conteúdos. É só entregar e cobrar do cliente.</p><p><strong>2. ENGENHARIA DE PROMPT — As 3 técnicas:</strong> • <strong>Few-Shot:</strong> Dê EXEMPLOS prontos antes de pedir: "Faça igual a este texto modelo...". • <strong>Chain-of-Thought:</strong> Mande: "Pense passo a passo antes de responder, mostre como chegou ao resultado". • <strong>Delimitação:</strong> Use colchetes para separar o texto: "Analise o texto a seguir: [conteúdo aqui]".</p><p><strong>3. CONSULTORIA EMPRESARIAL — Como aplicar e cobrar:</strong> Visite a empresa e veja onde perdem tempo: atendimento, e-mails, orçamentos. Crie um prompt padrão: "Você é o atendente da empresa X, responda com base nestas regras...". Coloque no WhatsApp ou e-mail. A IA responde sozinha. Você cobra R$ 500 a R$ 2.000 de instalação + R$ 100 a R$ 300 por mês de manutenção.</p>',
                titleFooter: "Slide 2: Monetização em Grande Escala",
                descFooter: "De simples freelancer a consultor de alto valor: aprenda a estruturar negócios usando IA."
            }
        ];
        let currentSlide = 0;
        function updateSlide() {
            const s = slides[currentSlide];
            document.querySelector('.slide-badge').innerText = s.badge;
            document.querySelector('.slide-screen h3').innerText = s.titleHeader;
            document.querySelector('.slide-screen p').innerText = s.descHeader;
            document.querySelector('.slide-content').innerHTML = s.content;
            document.querySelector('.slide-footer h2').innerText = s.titleFooter;
            document.querySelector('.slide-footer p').innerText = s.descFooter;
        }
        document.querySelectorAll('.btn-nav')[0].addEventListener('click', () => {
            if (currentSlide > 0) { currentSlide--; updateSlide(); }
        });
        document.querySelectorAll('.btn-nav')[1].addEventListener('click', () => {
            if (currentSlide < slides.length - 1) { currentSlide++; updateSlide(); }
        });
        updateSlide();
    </script>
</body>
</html>
